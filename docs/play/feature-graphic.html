<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:#101A13;color:#F4F1E8;font-family:Impact,"Arial Black","Liberation Sans Narrow","DejaVu Sans",sans-serif}
.bg{position:absolute;inset:0;background:#101A13;
  background-image:linear-gradient(rgba(242,237,228,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,228,.03) 1px,transparent 1px);
  background-size:24px 24px}
.wrap{position:absolute;inset:0;display:flex;align-items:center;padding:0 72px;gap:56px}
.mark{flex:0 0 auto;position:relative;width:200px;height:260px}
.text{flex:1}
h1{margin:0;font-size:126px;line-height:.9;letter-spacing:-.04em;font-weight:900;color:#F4F1E8;text-transform:lowercase}
.rule{height:6px;background:#FF4B7D;width:560px;margin:18px 0 20px}
p{margin:0;font-family:"JetBrains Mono","IBM Plex Mono","DejaVu Sans Mono","Liberation Mono",monospace;font-size:26px;letter-spacing:.15em;color:#2FA96C;text-transform:uppercase}
p.sub{margin-top:12px;color:rgba(242,237,228,.7);font-size:20px;letter-spacing:.05em}
</style></head><body><div class="bg"></div>
<div class="wrap">
  <div class="mark">
    <svg width="200" height="260" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 10h160v240l-80-52-80 52z" fill="#F4F1E8" transform="translate(12 12)"/>
      <path d="M20 10h160v240l-80-52-80 52z" fill="#FF4B7D" stroke="#101A13" stroke-width="5"/>
      <rect x="64" y="62" width="72" height="22" fill="#101A13"/>
      <rect x="64" y="104" width="72" height="7" fill="#1B2E1F"/>
    </svg>
  </div>
  <div class="text">
    <h1>backbee</h1>
    <div class="rule"></div>
    <p>&gt; One archive at a time</p>
    <p class="sub">A bookmark for 1,000-episode podcast backlogs</p>
  </div>
</div></body></html>
