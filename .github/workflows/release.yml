name: Release

# Builds the signed App Bundle that goes to Google Play.
#
# Triggered by pushing a tag such as v1.0.0, or by hand. See docs/RELEASE.md
# for the one-time setup (upload keystore, GitHub secrets, Play service
# account) and the per-release steps.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name to stamp on the build (e.g. 1.0.1). Defaults to the tag or 'manual'."
        required: false
        default: ""
      track:
        description: "Play track to upload to, if a Play service account secret is configured."
        required: false
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # versionCode has to climb monotonically across every upload to Play, so
      # it is this workflow's run number plus a base. Bump the base only if you
      # ever need to jump ahead (a manual upload with a higher number, or this
      # file being renamed, which resets the run counter).
      VERSION_CODE_BASE: 100

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list is "tools platform-tools", and
          # "tools" was retired from the SDK repository: asking for it makes
          # sdkmanager exit 1 and the whole job dies before anything compiles.
          # platform-tools is all this build needs installed by hand; Gradle
          # fetches the platform and build-tools it wants on its own.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify the Android SDK is visible to Gradle
        run: |
          test -d "$ANDROID_HOME" || { echo "::error::No Android SDK on the runner"; exit 1; }
          ./gradlew projects --console=plain | tee /tmp/projects.txt
          grep -q "Project ':app'" /tmp/projects.txt \
            || { echo "::error::':app' was excluded from the build"; exit 1; }

      - name: Work out the version
        id: version
        run: |
          code=$(( VERSION_CODE_BASE + GITHUB_RUN_NUMBER ))
          if [ -n "${{ github.event.inputs.versionName }}" ]; then
            name="${{ github.event.inputs.versionName }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="manual-${GITHUB_SHA::7}"
          fi
          echo "code=$code"  >> "$GITHUB_OUTPUT"
          echo "name=$name"  >> "$GITHUB_OUTPUT"
          echo "Building versionName=$name versionCode=$code"

      # The keystore lives in a secret as base64 (see docs/RELEASE.md). When it
      # is absent the build still runs and produces an unsigned bundle, and the
      # job says so loudly instead of failing - a dry run of the pipeline is
      # useful before the key exists.
      - name: Restore the upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BACKBEE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::BACKBEE_KEYSTORE_BASE64 is not set; the bundle will be UNSIGNED and cannot be uploaded to Play."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          path="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$path"
          echo "BACKBEE_KEYSTORE_PATH=$path" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: ./gradlew :core:test :app:testDebugUnitTest --console=plain --stacktrace

      - name: Build the signed release bundle and APK
        env:
          BACKBEE_KEYSTORE_PASSWORD: ${{ secrets.BACKBEE_KEYSTORE_PASSWORD }}
          BACKBEE_KEY_ALIAS: ${{ secrets.BACKBEE_KEY_ALIAS }}
          BACKBEE_KEY_PASSWORD: ${{ secrets.BACKBEE_KEY_PASSWORD }}
          # Read by app/build.gradle.kts through the environment rather than
          # -P arguments, so they never appear in the process list or a
          # --stacktrace dump.
          PODCAST_INDEX_KEY: ${{ secrets.PODCAST_INDEX_KEY }}
          PODCAST_INDEX_SECRET: ${{ secrets.PODCAST_INDEX_SECRET }}
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }} \
            --console=plain --stacktrace

      - name: Verify the bundle signature
        if: steps.keystore.outputs.signed == 'true'
        run: |
          aab=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          jarsigner -verify -verbose:summary "$aab" | tail -5
          jarsigner -verify "$aab" | grep -q "jar verified" \
            || { echo "::error::The bundle is not signed with the upload key"; exit 1; }
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"

      - name: Rename outputs
        id: outputs
        run: |
          v="${{ steps.version.outputs.name }}"
          mkdir -p dist
          cp app/build/outputs/bundle/release/*.aab "dist/backbee-$v.aab"
          cp app/build/outputs/apk/release/*.apk    "dist/backbee-$v.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-$v.txt"
          ls -la dist

      # Artifacts need a GitHub sign-in to download and expire, which is the
      # right visibility for a paid app's installable build. Nothing here is
      # attached to a public release.
      - name: Upload release outputs
        uses: actions/upload-artifact@v4
        with:
          name: backbee-release-${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      # Optional last mile: straight to a Play track. Needs a service account
      # JSON in PLAY_SERVICE_ACCOUNT_JSON with release access to the app in
      # Play Console (docs/RELEASE.md). Skipped silently until it exists.
      - name: Check for Play credentials
        id: play
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "configured=$([ -n "$SA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        if: steps.play.outputs.configured == 'true' && steps.keystore.outputs.signed == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.backbee
          releaseFiles: dist/backbee-${{ steps.version.outputs.name }}.aab
          mappingFile: dist/mapping-${{ steps.version.outputs.name }}.txt
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          releaseName: ${{ steps.version.outputs.name }}

      - name: Summary
        run: |
          {
            echo "## backbee ${{ steps.version.outputs.name }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| versionCode | ${{ steps.version.outputs.code }} |"
            echo "| Signed | ${{ steps.keystore.outputs.signed }} |"
            echo "| Uploaded to Play | ${{ steps.play.outputs.configured == 'true' && steps.keystore.outputs.signed == 'true' }} |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
