name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Not cancel-in-progress: a manual dispatch while a push build is running
  # would kill the push build, and two dead runs look exactly like one slow one.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # settings.gradle.kts skips :app when it cannot find an SDK, so without
      # this guard a misconfigured runner would report a green build that
      # quietly produced no APK at all.
      - name: Verify the Android SDK is visible to Gradle
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::No Android SDK on the runner"; exit 1; }
          ./gradlew projects --console=plain | tee /tmp/projects.txt
          grep -q "Project ':app'" /tmp/projects.txt \
            || { echo "::error::':app' was excluded from the build"; exit 1; }

      - name: Core tests (pure JVM)
        run: ./gradlew :core:test --console=plain --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      # Published straight after assembling, before the tests. A failing test
      # should turn the build red, but it should not withhold an APK that
      # compiled - the artifact is how the app gets onto a phone at all.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: backbee-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      - name: Lint
        if: always()
        run: ./gradlew :app:lintDebug --console=plain || true

      # Rendered screens, published to their own branch. Artifact downloads are
      # signed blob URLs that are not reachable from every environment, whereas
      # a branch can simply be fetched - and the images stay reviewable in the
      # repository rather than expiring in 30 days.
      - name: Publish screenshots
        if: always()
        run: |
          shopt -s nullglob
          shots=(app/build/outputs/roborazzi/*.png)
          if [ ${#shots[@]} -eq 0 ]; then
            echo "No screenshots produced; nothing to publish."
            exit 0
          fi
          echo "Publishing ${#shots[@]} screenshot(s)."

          tmp=$(mktemp -d)
          cp "${shots[@]}" "$tmp/"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Orphan branch: screenshots only, no code history, force-pushed each
          # run so it always reflects the current commit rather than accreting.
          git checkout --orphan screenshots
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf $(git ls-files) 2>/dev/null || true
          mkdir -p screenshots
          cp "$tmp"/*.png screenshots/
          {
            echo "# Rendered screens"
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_RUN_ID}"
            echo
            for f in screenshots/*.png; do echo "- \`$f\`"; done
          } > README.md
          git add -A screenshots README.md
          git commit -q -m "Screens rendered from ${GITHUB_SHA::7}" || exit 0
          git push -f origin screenshots

      # A stable, sign-in-free download for the phone. Actions artifacts always
      # require a GitHub login and arrive as a zip, which Android cannot open
      # without a third-party file manager; a release asset is a direct tap.
      #
      # Only on a fully green build. The artifact above already covers "it
      # compiled" - a release should mean the tests passed too.
      - name: Publish debug APK to the rolling release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$apk" backbee-debug.apk
          size=$(du -h backbee-debug.apk | cut -f1)
          dl="https://github.com/${GITHUB_REPOSITORY}/releases/download/debug-latest/backbee-debug.apk"

          # Notes are written to a file rather than a heredoc: this run block is
          # indented by YAML, and an indented heredoc terminator is not
          # recognised by bash.
          {
            printf 'Rolling debug build, replaced on every green CI run.\n\n'
            printf '**[Download backbee-debug.apk](%s)** — %s\n\n' "$dl" "$size"
            printf '| | |\n|---|---|\n'
            printf '| Commit | `%s` |\n' "${GITHUB_SHA:0:7}"
            printf '| Branch | `%s` |\n' "${GITHUB_REF_NAME}"
            printf '| Built | %s |\n' "$(date -u '+%Y-%m-%d %H:%M UTC')"
            printf '| App ID | `dev.backbee.debug` |\n'
            printf '| Requires | Android 8.0+ |\n\n'
            printf 'Tap the link on the phone. Android will ask you to allow\n'
            printf '"Install unknown apps" for whichever browser you used, then install.\n\n'
            printf 'Signed with the throwaway debug key and using a `.debug` application\n'
            printf 'id, so it installs alongside anything else and cannot later be\n'
            printf 'upgraded in place to a release build.\n'
          } > release-notes.md

          # One stable tag, updated in place, so the download URL never changes.
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release edit debug-latest --notes-file release-notes.md
          else
            gh release create debug-latest \
              --prerelease \
              --title "backbee · latest debug build" \
              --notes-file release-notes.md
          fi

          gh release upload debug-latest backbee-debug.apk --clobber
          echo "Published $dl"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/tests/**
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
