name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # settings.gradle.kts skips :app when it cannot find an SDK, so without
      # this guard a misconfigured runner would report a green build that
      # quietly produced no APK at all.
      - name: Verify the Android SDK is visible to Gradle
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::No Android SDK on the runner"; exit 1; }
          ./gradlew projects --console=plain | tee /tmp/projects.txt
          grep -q "Project ':app'" /tmp/projects.txt \
            || { echo "::error::':app' was excluded from the build"; exit 1; }

      - name: Core tests (pure JVM)
        run: ./gradlew :core:test --console=plain --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      - name: Lint
        if: always()
        run: ./gradlew :app:lintDebug --console=plain || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backbee-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/tests/**
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
